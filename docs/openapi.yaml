    delete:
      operationId: deleteVault
      summary: 按版本删除密文并保留墓碑，防止旧设备自动复活
      parameters:
      - name: If-Match
        in: header
        required: true
        description: 最近元信息的强 ETag，不允许通配符或弱标签。
        schema:
          $ref: '#/components/schemas/StrongETag'
      - name: Idempotency-Key
        in: header
        required: true
        description: 与 body.operationId 相同，重试必须复用原值与请求字节。
        schema:
          $ref: '#/components/schemas/UuidV4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteVaultRequest'
      responses:
        '200':
          description: 删除回执；重复请求重放原回执
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              description: 必须返回；true 表示原操作的回执重放，不能假定它仍是最新头。
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
          content:
            application/json:
