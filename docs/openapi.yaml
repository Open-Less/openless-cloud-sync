  /v1/me/vault:
    get:
      operationId: getVaultMetadata
      summary: 读取当前账号元信息，空库也返回 200
      parameters:
      - name: If-None-Match
        in: header
        required: false
        schema:
          $ref: '#/components/schemas/StrongETag'
      responses:
        '200':
          description: 当前元信息及强 ETag
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            ETag:
              description: 必须返回，客户端按原样保存的强实体标签。
              schema:
                $ref: '#/components/schemas/StrongETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultMetadata'
        '304':
          description: 与该 ETag 一致，无响应体；保留本地已缓存的同账号元信息
          headers:
            ETag:
              schema:
                $ref: '#/components/schemas/StrongETag'
            Cache-Control:
              schema:
                type: string
                const: no-store
