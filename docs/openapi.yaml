openapi: 3.1.0
info:
  title: OpenLess Encrypted Cloud Sync API
  version: 1.0-draft.1
  description: 服务端 0.1.0 已上线供指定账号联调，完整客户端验收待完成。仅存储端到端加密快照。行为约束见 http-api.md，AAD 与密码学见 encryption-protocol.md。
servers:
- url: https://apic.openless.top:9443
  description: 已部署的指定账号联调环境
- url: https://sync.openless.example
  description: 保留示例域名，不是生产地址
security:
- SyncBearer: []
paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: 读取协议能力，不含用户数据
      security: []
      responses:
        '200':
          description: 固定协议能力
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '429':
          description: 结构化错误；按 code 处理，不能据 message 推断是否可覆盖数据。
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              description: 必须返回秒数；只阻止提前重试，不要求客户端启动轮询。
              schema:
                type: integer
                minimum: 1
                maximum: 86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 结构化错误；按 code 处理，不能据 message 推断是否可覆盖数据。
          headers:
            Cache-Control:
              schema:
