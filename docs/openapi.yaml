  /v1/me/operations/{operationId}:
    get:
      operationId: getOperationReceipt
      summary: 核对当前账号的写入结果，404 不证明原请求一定失败
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UuidV4'
      responses:
        '200':
          description: 原操作提交回执
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        '202':
          description: 操作仍在处理中；保留状态，下一次有效同步事件再处理
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
