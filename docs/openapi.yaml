                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        '202':
          description: 操作仍在处理中；保留状态，下一次有效同步事件再处理
          headers:
            Cache-Control:
              schema:
